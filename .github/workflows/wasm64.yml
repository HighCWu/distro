name: Wasm64

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/wasm64.yml
      - distro/default.nix
      - distro/linux/**
      - distro/musl/**
      - distro/npm/browser-tests.nix
      - packages/browser-tests/memory64-app.js
      - packages/browser-tests/memory64-index.html
      - packages/browser-tests/memory64-tests/**
      - packages/browser-tests/package.json
      - packages/browser-tests/playwright.config.js
      - packages/browser-tests/server.js
      - packages/bytes/**
      - packages/kernel/**
      - scripts/smoke-memory64.mjs
      - flake.lock
      - flake.nix
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    paths:
      - .github/workflows/wasm64.yml
      - distro/default.nix
      - distro/linux/**
      - distro/musl/**
      - distro/npm/browser-tests.nix
      - packages/browser-tests/memory64-app.js
      - packages/browser-tests/memory64-index.html
      - packages/browser-tests/memory64-tests/**
      - packages/browser-tests/package.json
      - packages/browser-tests/playwright.config.js
      - packages/browser-tests/server.js
      - packages/bytes/**
      - packages/kernel/**
      - scripts/smoke-memory64.mjs
      - flake.lock
      - flake.nix
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel and host runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
      - name: Build Memory64 artifacts
        run: |
          nix build \
            --no-link \
            --print-build-logs \
            .#linux-wasm64
          nix build \
            --no-link \
            --print-build-logs \
            .#musl-wasm64
          nix build \
            --out-link result-kernel-wasm64 \
            --print-build-logs \
            .#kernel-wasm64
      - name: Boot Memory64 kernel
        run: node scripts/smoke-memory64.mjs result-kernel-wasm64
      - name: Boot Memory64 kernel in stable browsers
        run: |
          nix build \
            --no-link \
            --print-build-logs \
            .#checks.x86_64-linux.browser-tests-check-memory64-chromium \
            .#checks.x86_64-linux.browser-tests-check-memory64-firefox
