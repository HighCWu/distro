name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      heavy-check:
        description: Run only this heavy check (leave empty for the full matrix)
        required: false
        type: string
      python-forkless-host:
        description: Run only the native Python forkless replay (leave heavy-check empty)
        required: false
        type: boolean
        default: false
      fork-benchmark:
        description: Run fresh single-thread fork measurements using this repository's build cache
        required: false
        type: boolean
        default: false
      fork-benchmark-width:
        description: Pointer width for a fresh benchmark (only with fork-benchmark)
        type: choice
        options:
          - both
          - wasm32
          - wasm64
        default: both
      fork-benchmark-profile:
        description: Use the separate diagnostic kernel, never a baseline performance claim
        type: boolean
        default: false
      fork-benchmark-worker-pair:
        description: Uninstrumented original/bundled Worker experiment, not a default build
        type: boolean
        default: false
      fork-benchmark-worker-transform:
        description: Entry-only ESM conversion control, without bundling or default changes
        type: boolean
        default: false
      fork-benchmark-native-compare:
        description: Same-host native Linux and Node fork/exec latency experiment
        type: boolean
        default: false

jobs:
  benchmark-mode:
    name: Validate benchmark dispatch mode
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['fork-benchmark'] }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Reject conflicting check modes
        env:
          REQUESTED_HEAVY_CHECK: ${{ inputs['heavy-check'] }}
          PYTHON_FORKLESS_HOST: ${{ inputs['python-forkless-host'] }}
          PROFILE: ${{ inputs['fork-benchmark-profile'] }}
          WORKER_PAIR: ${{ inputs['fork-benchmark-worker-pair'] }}
          WORKER_TRANSFORM: ${{ inputs['fork-benchmark-worker-transform'] }}
          NATIVE_COMPARE: ${{ inputs['fork-benchmark-native-compare'] }}
        run: |
          test -z "$REQUESTED_HEAVY_CHECK"
          test "$PYTHON_FORKLESS_HOST" != true
          if [[ "$WORKER_PAIR" == true ]]; then test "$PROFILE" != true; fi
          if [[ "$WORKER_TRANSFORM" == true ]]; then
            test "$PROFILE" != true
            test "$WORKER_PAIR" != true
          fi
          if [[ "$NATIVE_COMPARE" == true ]]; then
            test "$PROFILE" != true
            test "$WORKER_PAIR" != true
            test "$WORKER_TRANSFORM" != true
          fi
  fork-benchmark:
    needs: benchmark-mode
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['fork-benchmark'] }}
    uses: ./.github/workflows/fork-benchmark.yml
    with:
      profile: ${{ inputs['fork-benchmark-profile'] }}
      worker-pair: ${{ inputs['fork-benchmark-worker-pair'] }}
      worker-transform: ${{ inputs['fork-benchmark-worker-transform'] }}
      native-compare: ${{ inputs['fork-benchmark-native-compare'] }}
      widths: ${{ inputs['fork-benchmark-width'] == 'wasm32' && '[32]' || inputs['fork-benchmark-width'] == 'wasm64' && '[64]' || '[32,64]' }}
  python-forkless-host:
    name: Native Python forkless replay
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['python-forkless-host'] && !inputs['fork-benchmark'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Reject conflicting check modes
        env:
          REQUESTED_HEAVY_CHECK: ${{ inputs['heavy-check'] }}
        run: test -z "$REQUESTED_HEAVY_CHECK"
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Replay the pinned CPython integration patch without target builds
        run: |
          nix build '.#checks.x86_64-linux.python-check-forkless-host' \
            --no-link --print-build-logs

  plan:
    name: Plan checks
    if: ${{ !inputs['python-forkless-host'] && !inputs['fork-benchmark'] }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      heavy-checks: ${{ steps.plan.outputs.heavy-checks }}
      targeted: ${{ steps.plan.outputs.targeted }}
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - id: plan
        name: Discover heavy checks
        env:
          REQUESTED_HEAVY_CHECK: ${{ inputs['heavy-check'] }}
        run: |
          checks=$(nix eval --json '.#ciJobs.x86_64-linux.heavyChecks' \
            --apply 'checks: builtins.attrNames checks')
          targeted=false
          if [[ -n "$REQUESTED_HEAVY_CHECK" ]]; then
            targeted=true
            checks=$(jq --compact-output --arg check "$REQUESTED_HEAVY_CHECK" '
              if index($check) != null then
                [$check]
              else
                error("unknown heavy check: " + $check)
              end
            ' <<< "$checks")
            # Listing attribute names does not force derivation evaluation.
            # Catch invalid SDK/package overrides before provisioning a heavy job.
            nix eval --show-trace --raw \
              ".#checks.x86_64-linux.$REQUESTED_HEAVY_CHECK.drvPath" >/dev/null
          fi
          echo "heavy-checks=$(jq --compact-output '{check: .}' <<< "$checks")" \
            >> "$GITHUB_OUTPUT"
          echo "targeted=$targeted" >> "$GITHUB_OUTPUT"

  build:
    name: Build packages and checks
    needs: plan
    if: needs.plan.outputs.targeted != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-ci-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: |
            nix-ci-${{ runner.os }}-
            nix-wasm64-${{ runner.os }}-
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 9G
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Build checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checks_file="$RUNNER_TEMP/checks.json"
          nix eval --json '.#ciJobs.x86_64-linux' --apply '
            jobs:
            let
              describeBuilds = builtins.mapAttrs (_: derivation: { drv = derivation.drvPath; });
              describeChecks = builtins.mapAttrs (
                _: derivation:
                {
                  drv = derivation.drvPath;
                  outputs = map (output: (builtins.getAttr output derivation).outPath) derivation.outputs;
                }
              );
            in
            {
              builds = describeBuilds jobs.builds;
              checks = describeChecks jobs.checks;
            }
          ' > "$checks_file"

          status() {
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              --field state="$2" \
              --field context="checks/$1" \
              --field description="$3" \
              --field target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null
          }

          mapfile -t builds < <(jq --raw-output '.builds | keys[]' "$checks_file")
          mapfile -t checks < <(jq --raw-output '.checks | keys[]' "$checks_file")
          installables=()
          for build in "${builds[@]}"; do
            drv=$(jq --raw-output --arg build "$build" '.builds[$build].drv' "$checks_file")
            installables+=("$drv^*")
          done
          for check in "${checks[@]}"; do
            status "$check" pending "Build in progress"
            drv=$(jq --raw-output --arg check "$check" '.checks[$check].drv' "$checks_file")
            installables+=("$drv^*")
          done

          set +e
          nix build \
            --max-jobs auto \
            --keep-going \
            --no-link \
            --print-build-logs \
            "${installables[@]}"
          build_status=$?
          set -e

          for check in "${checks[@]}"; do
            mapfile -t outputs < <(
              jq --raw-output --arg check "$check" '.checks[$check].outputs[]' "$checks_file"
            )
            state=success
            description="Build passed"
            for output in "${outputs[@]}"; do
              if ! nix path-info "$output" >/dev/null 2>&1; then
                state=failure
                description="Build failed"
                break
              fi
            done
            status "$check" "$state" "$description"
          done

          exit "$build_status"
      - name: Build npm packages
        run: |
          nix build .#kernel --out-link result-kernel --print-build-logs
          nix build .#linux-guest --out-link result-linux-guest --print-build-logs
          # Keep expensive build-only inputs reachable during the cache post-step GC.
          nix build \
            --out-link result-ci-cache \
            .#llvm-toolchain-unwrapped \
            .#linux
          mkdir npm-packages
          cp -L result-kernel/package.tgz npm-packages/kernel.tgz
          cp -L result-linux-guest/package.tgz npm-packages/linux-guest.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error

  heavy-check:
    name: Heavy check / ${{ matrix.check }}
    needs:
      - plan
      - build
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.heavy-checks) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        id: heavy-cache
        with:
          primary-key: nix-targeted-v1-${{ runner.os }}-${{ (contains(matrix.check, 'wasm64') || contains(matrix.check, 'memory64')) && 'wasm64' || 'wasm32' }}-${{ hashFiles('distro/llvm-toolchain/**', 'distro/llvm-runtimes/**', 'distro/platform.nix', 'distro/linux/package.nix', 'distro/linux/fetch-source.nix', 'flake.lock') }}
          restore-prefixes-first-match: |
            nix-targeted-v1-${{ runner.os }}-${{ (contains(matrix.check, 'wasm64') || contains(matrix.check, 'memory64')) && 'wasm64' || 'wasm32' }}-
            ${{ (contains(matrix.check, 'wasm64') || contains(matrix.check, 'memory64')) && format('nix-wasm64-v2-{0}-', runner.os) || format('nix-ci-{0}-', runner.os) }}
            nix-ci-${{ runner.os }}-
          save: false
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Build isolated check
        run: |
          installable=".#ciJobs.x86_64-linux.heavyChecks.${{ matrix.check }}"
          if [[ "${{ needs.plan.outputs.targeted }}" == true ]]; then
            nix build --no-link --print-build-logs .#checks.x86_64-linux.formatting
          fi
          nix build --show-trace --no-link --print-build-logs "$installable"
      - name: Collect validated SDK build materials
        if: ${{ success() && (matrix.check == 'sdk-check-build-materials' || matrix.check == 'sdk-wasm64-check-build-materials') }}
        env:
          SDK_CHECK: ${{ matrix.check }}
        run: |
          case "$SDK_CHECK" in
            sdk-check-build-materials) package=sdk ;;
            sdk-wasm64-check-build-materials) package=sdk-wasm64 ;;
            *) exit 1 ;;
          esac
          bundle=$(nix eval --raw ".#$package.buildMaterials.outPath")
          nix path-info "$bundle"
          mkdir sdk-build-materials
          cp "$bundle/sdk-build-materials.tar.gz" "$bundle/README.md" \
            "$bundle/SHA256SUMS" sdk-build-materials/
          (cd sdk-build-materials && sha256sum --check SHA256SUMS)
      - name: Upload validated SDK build materials
        if: ${{ success() && (matrix.check == 'sdk-check-build-materials' || matrix.check == 'sdk-wasm64-check-build-materials') }}
        uses: actions/upload-artifact@v7
        with:
          name: sdk-build-materials-${{ matrix.check }}-${{ github.sha }}
          path: sdk-build-materials/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Collect validated SDK source inputs
        if: ${{ success() && (matrix.check == 'sdk-check-source-bundle' || matrix.check == 'sdk-wasm64-check-source-bundle') }}
        env:
          SDK_CHECK: ${{ matrix.check }}
        run: |
          case "$SDK_CHECK" in
            sdk-check-source-bundle) package=sdk ;;
            sdk-wasm64-check-source-bundle) package=sdk-wasm64 ;;
            *) exit 1 ;;
          esac
          bundle=$(nix eval --raw ".#$package.sourceBundle.outPath")
          nix path-info "$bundle"
          mkdir sdk-selected-sources
          cp "$bundle/sdk-selected-sources.tar.gz" "$bundle/README.md" \
            "$bundle/SHA256SUMS" sdk-selected-sources/
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          python3 -B distro/sdk/checkout-bundle-test.py
          python3 -B distro/sdk/checkout-bundle.py export . "$GITHUB_SHA" \
            sdk-selected-sources/distro-checkout.tar.gz
          # Nix outputs are read-only; modify only the collected manifest copy.
          chmod u+w sdk-selected-sources/SHA256SUMS
          (cd sdk-selected-sources && sha256sum distro-checkout.tar.gz >> SHA256SUMS)
          (cd sdk-selected-sources && sha256sum --check SHA256SUMS)
      - name: Upload validated SDK source inputs
        if: ${{ success() && (matrix.check == 'sdk-check-source-bundle' || matrix.check == 'sdk-wasm64-check-source-bundle') }}
        uses: actions/upload-artifact@v7
        with:
          name: sdk-selected-sources-${{ matrix.check }}-${{ github.sha }}
          path: sdk-selected-sources/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Collect the validated kernel source bundle
        if: ${{ success() && startsWith(matrix.check, 'kernel') && endsWith(matrix.check, '-check-source-bundle') }}
        env:
          WASM64_CHECK: ${{ (contains(matrix.check, 'wasm64') || contains(matrix.check, 'memory64')) }}
        run: |
          package=kernel
          if [[ "$WASM64_CHECK" == true ]]; then package=kernel-wasm64; fi
          bundle=$(nix eval --raw ".#$package.sourceBundle.outPath")
          nix path-info "$bundle"
          mkdir source-bundle
          cp "$bundle/linux-source.tar.gz" "$bundle/README.md" "$bundle/SHA256SUMS" source-bundle/
      - uses: actions/upload-artifact@v4
        if: ${{ success() && startsWith(matrix.check, 'kernel') && endsWith(matrix.check, '-check-source-bundle') }}
        with:
          name: kernel-source-${{ matrix.check }}-${{ github.sha }}
          path: source-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Collect the validated BusyBox source bundle
        if: ${{ success() && startsWith(matrix.check, 'busybox') && endsWith(matrix.check, '-check-source-bundle') }}
        env:
          WASM64_CHECK: ${{ (contains(matrix.check, 'wasm64') || contains(matrix.check, 'memory64')) }}
        run: |
          package=busybox
          if [[ "$WASM64_CHECK" == true ]]; then package=busybox-wasm64; fi
          bundle=$(nix eval --raw ".#$package.sourceBundle.outPath")
          nix path-info "$bundle"
          mkdir busybox-source-bundle
          cp "$bundle/busybox-source.tar.gz" "$bundle/README.md" "$bundle/SHA256SUMS" \
            "$bundle/BINARY_SHA256SUMS" busybox-source-bundle/
      - uses: actions/upload-artifact@v4
        if: ${{ success() && startsWith(matrix.check, 'busybox') && endsWith(matrix.check, '-check-source-bundle') }}
        with:
          name: busybox-source-${{ matrix.check }}-${{ github.sha }}
          path: busybox-source-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Collect verified Git build materials
        if: ${{ success() && startsWith(matrix.check, 'git') && endsWith(matrix.check, '-check-build-materials') }}
        env:
          CHECK: ${{ matrix.check }}
        run: |
          case "$CHECK" in
            git-check-build-materials) package=git ;;
            git-wasm64-check-build-materials) package=git-wasm64 ;;
            *) echo "Unexpected Git materials check: $CHECK" >&2; exit 1 ;;
          esac
          materials=$(nix eval --raw ".#$package.buildMaterials.outPath")
          verification=$(nix eval --raw ".#$package.checks.build-materials.outPath")
          nix path-info "$materials" "$verification"
          mkdir git-build-materials
          cp -R "$materials/." git-build-materials/
          cp -R "$verification" git-build-materials/verification
          cmp git-build-materials/SHA256SUMS git-build-materials/verification/MATERIALS_SHA256SUMS
          (cd git-build-materials && sha256sum --check verification/MATERIALS_SHA256SUMS)
          (cd git-build-materials/verification && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: ${{ success() && startsWith(matrix.check, 'git') && endsWith(matrix.check, '-check-build-materials') }}
        with:
          name: git-build-materials-${{ matrix.check }}-${{ github.sha }}
          path: git-build-materials/
          if-no-files-found: error
          retention-days: 3
      - name: Collect verified Python build materials
        if: ${{ success() && startsWith(matrix.check, 'python') && endsWith(matrix.check, '-check-build-materials') }}
        env:
          MATERIALS_CHECK: ${{ matrix.check }}
        run: |
          case "$MATERIALS_CHECK" in
            python-check-build-materials) package=python ;;
            python-wasm64-check-build-materials) package=python-wasm64 ;;
            *) exit 64 ;;
          esac
          materials=$(nix eval --raw ".#$package.buildMaterials.outPath")
          verification=$(nix eval --raw ".#$package.checks.build-materials.outPath")
          nix path-info "$materials" >/dev/null
          nix path-info "$verification" >/dev/null
          mkdir python-build-materials
          cp -R "$materials/." python-build-materials/
          cp -R "$verification" python-build-materials/verification
          cmp python-build-materials/SHA256SUMS python-build-materials/verification/MATERIALS_SHA256SUMS
          (cd python-build-materials && sha256sum --check verification/MATERIALS_SHA256SUMS)
          (cd python-build-materials/verification && sha256sum --check SHA256SUMS)
      - name: Upload verified Python build materials
        if: ${{ success() && startsWith(matrix.check, 'python') && endsWith(matrix.check, '-check-build-materials') }}
        uses: actions/upload-artifact@v7
        with:
          name: python-build-materials-${{ matrix.check }}-${{ github.sha }}
          path: python-build-materials/
          if-no-files-found: error
          retention-days: 3
      - name: Collect validated selected Git sources
        if: ${{ success() && (matrix.check == 'git-check-source-bundle' || matrix.check == 'git-wasm64-check-source-bundle') }}
        env:
          SOURCE_CHECK: ${{ matrix.check }}
        run: |
          case "$SOURCE_CHECK" in
            git-check-source-bundle) package=git ;;
            git-wasm64-check-source-bundle) package=git-wasm64 ;;
            *) exit 64 ;;
          esac
          bundle=$(nix eval --raw ".#$package.sourceBundle.outPath")
          nix path-info "$bundle" >/dev/null
          (cd "$bundle" && sha256sum --check SHA256SUMS)
          mkdir git-selected-sources
          cp "$bundle/git-selected-sources.tar.gz" "$bundle/README.md" \
            "$bundle/BINARY_SHA256SUMS" "$bundle/SHA256SUMS" git-selected-sources/
          (cd git-selected-sources && sha256sum --check SHA256SUMS)
      - name: Upload selected Git sources
        if: ${{ success() && (matrix.check == 'git-check-source-bundle' || matrix.check == 'git-wasm64-check-source-bundle') }}
        uses: actions/upload-artifact@v7
        with:
          name: git-selected-sources-${{ matrix.check }}-${{ github.sha }}
          path: git-selected-sources/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Collect validated selected Python sources
        if: ${{ success() && (matrix.check == 'python-check-source-bundle' || matrix.check == 'python-wasm64-check-source-bundle') }}
        env:
          SOURCE_CHECK: ${{ matrix.check }}
        run: |
          case "$SOURCE_CHECK" in
            python-check-source-bundle) package=python ;;
            python-wasm64-check-source-bundle) package=python-wasm64 ;;
            *) exit 64 ;;
          esac
          bundle=$(nix eval --raw ".#$package.sourceBundle.outPath")
          nix path-info "$bundle" >/dev/null
          (cd "$bundle" && sha256sum --check SHA256SUMS)
          mkdir python-selected-sources
          cp "$bundle/python-selected-sources.tar.gz" "$bundle/README.md" \
            "$bundle/BINARY_SHA256SUMS" "$bundle/SHA256SUMS" python-selected-sources/
          (cd python-selected-sources && sha256sum --check SHA256SUMS)
      - name: Upload selected Python sources
        if: ${{ success() && (matrix.check == 'python-check-source-bundle' || matrix.check == 'python-wasm64-check-source-bundle') }}
        uses: actions/upload-artifact@v7
        with:
          name: python-selected-sources-${{ matrix.check }}-${{ github.sha }}
          path: python-selected-sources/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Retain completed toolchain outputs after targeted checks
        id: retained
        if: ${{ !cancelled() && needs.plan.outputs.targeted == 'true' && steps.heavy-cache.outcome == 'success' && steps.heavy-cache.outputs.hit-primary-key != 'true' }}
        env:
          WASM64_CHECK: ${{ (contains(matrix.check, 'wasm64') || contains(matrix.check, 'memory64')) }}
        run: |
          suffix=""
          if [[ "$WASM64_CHECK" == true ]]; then suffix="-wasm64"; fi
          compiler_ready=false
          for package in llvm-toolchain-unwrapped "llvm-toolchain$suffix" "linux$suffix"; do
            # Evaluate and root only outputs that already exist. Never start
            # another compiler build while handling a failed runtime check.
            output=$(nix eval --raw ".#${package}.outPath")
            if nix path-info "$output" >/dev/null 2>&1; then
              nix-store --add-root "$RUNNER_TEMP/cache-$package" --indirect --realise "$output"
              if [[ "$package" == llvm-toolchain-unwrapped ]]; then
                compiler_ready=true
              fi
            fi
          done
          # A compiled kernel need not retain its build-time source in its
          # runtime closure. Keep the exact fixed-output source explicitly.
          source_ready=false
          source_output=$(nix eval --raw ".#linux$suffix.src.outPath")
          if nix path-info "$source_output" >/dev/null 2>&1; then
            nix-store --add-root "$RUNNER_TEMP/cache-linux-source" --indirect --realise "$source_output"
            source_ready=true
          fi
          # Do not permanently occupy an immutable primary key with a partial
          # cache that cannot reuse both the compiler and this kernel's source.
          if [[ $compiler_ready == true && $source_ready == true ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save targeted build dependencies even if the runtime check failed
        if: ${{ !cancelled() && steps.retained.outputs.ready == 'true' }}
        uses: nix-community/cache-nix-action/save@v7
        with:
          # Pass the same key explicitly: the restore step returned an empty
          # primary-key output in the save:false job, despite declaring it.
          primary-key: nix-targeted-v1-${{ runner.os }}-${{ (contains(matrix.check, 'wasm64') || contains(matrix.check, 'memory64')) && 'wasm64' || 'wasm32' }}-${{ hashFiles('distro/llvm-toolchain/**', 'distro/llvm-runtimes/**', 'distro/platform.nix', 'distro/linux/package.nix', 'distro/linux/fetch-source.nix', 'flake.lock') }}
          gc-max-store-size-linux: 9G

  deploy-site:
    name: Deploy site
    needs:
      - build
      - heavy-check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tombl/distro') || github.event.pull_request.head.repo.full_name == 'tombl/distro'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Publish apk repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tombl/distro'
        env:
          APK_SIGNING_KEY: ${{secrets.APK_SIGNING_KEY}}
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
          R2_BUCKET: ${{secrets.R2_BUCKET}}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{secrets.R2_ACCESS_KEY_ID}}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{secrets.R2_SECRET_ACCESS_KEY}}
          RCLONE_CONFIG_R2_ENDPOINT: "https://7d87194d9d4af2959fb81de343dd63d9.r2.cloudflarestorage.com"
        run: |
          distro/site/scripts/publish-apk-repo.sh
      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tombl/distro'
        env:
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
        run: |
          nix run .#wrangler-deploy
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
        run: |
          output=$(nix run .#wrangler-preview -- \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} at ${GITHUB_SHA}" 2>&1 | tee /dev/stderr)
          {
            echo "### Site preview"
            printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+' | tail -1
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish npm packages and GitHub release
    needs:
      - build
      - heavy-check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'tombl/distro'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-packages
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.16.0
      - name: Validate release metadata
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(jq --raw-output .version packages/bytes/package.json)" = "$version"
          test "$(jq --raw-output .version packages/kernel/package.json)" = "$version"
          test "$(jq --raw-output .version packages/linux-guest/package.json)" = "$version"
          test "$(jq --raw-output .version packages/runner/package.json)" = "$version"
          node scripts/release-notes.mjs "$version" > release-notes.md
      - name: Publish packages
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          publish() {
            package="$1"
            archive="$2"
            if npm view "${package}@${version}" version >/dev/null 2>&1; then
              echo "${package}@${version} is already published"
            else
              npm publish "$archive" --access public
            fi
          }

          publish @lowland/kernel ./npm-packages/kernel.tgz
          publish @lowland/guest ./npm-packages/linux-guest.tgz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a GitHub release"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
