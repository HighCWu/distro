# SPDX-License-Identifier: MIT
name: Paired mmap benchmark

on:
  workflow_dispatch:
    inputs:
      comparison:
        description: Controlled search-mode comparison
        type: choice
        default: reset-vs-disabled
        options:
          - reset-vs-disabled
          - generation-vs-reset

permissions:
  contents: read

concurrency:
  group: mmap-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Paired wasm${{ matrix.bits }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bits: [32, 64]
        include:
          - bits: 32
            cache-prefix: nix-ci
          - bits: 64
            cache-prefix: nix-wasm64-v2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-mmap-${{ matrix.bits }}-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: |
            ${{ matrix.cache-prefix }}-${{ runner.os }}-
            nix-wasm64-v2-${{ runner.os }}-
            nix-ci-${{ runner.os }}-
          save: false
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
      - name: Formatting preflight
        run: |
          python3 -B scripts/test_mmap_benchmark.py
          nix build --no-link --print-build-logs .#checks.x86_64-linux.formatting
      - name: Build both modes without running cached benchmark checks
        env:
          BITS: ${{ matrix.bits }}
          COMPARISON: ${{ inputs.comparison }}
        run: |
          suffix=""
          if [[ "$BITS" == 64 ]]; then suffix="-wasm64"; fi
          on="mmap-benchmark$suffix"
          off="mmap-benchmark-baseline$suffix"
          if [[ "$COMPARISON" == generation-vs-reset ]]; then
            on="mmap-benchmark-generation$suffix"
            off="mmap-benchmark$suffix"
            nix build --no-link --print-build-logs ".#checks.x86_64-linux.mmap-search-generation-wrap-correctness$suffix"
            if [[ "$BITS" == 32 ]]; then
              nix build --no-link --print-build-logs .#checks.x86_64-linux.mmap-search-generation-wrap-clone-no-vm
            fi
          fi
          nix build --print-build-logs --out-link result-on ".#$on"
          nix build --print-build-logs --out-link result-off ".#$off"
          nix build --print-build-logs --out-link result-kernel ".#kernel$suffix"
          nix build --print-build-logs --out-link result-runner .#legacyPackages.x86_64-linux.vm-test.runner
      - name: Fresh correctness boots and alternating paired trials
        env:
          BITS: ${{ matrix.bits }}
          COMPARISON: ${{ inputs.comparison }}
        run: |
          set -euo pipefail
          mkdir results
          {
            printf 'revision=%s\npointer_bits=%s\ncpus=4\n' "$GITHUB_SHA" "$BITS"
            printf 'comparison=%s\n' "$COMPARISON"
            if [[ "$COMPARISON" == generation-vs-reset ]]; then
              printf 'off=reset-dedup\non=generation-dedup\n'
            else
              printf 'off=disabled-dedup\non=reset-dedup\n'
            fi
            node --version
            uname -a
            lscpu
            for mode in on off; do
              printf '%s artifacts: ' "$mode"
              readlink -f "result-$mode"
            done
            readlink -f result-kernel
            git show HEAD:distro/musl/package.nix
            git show HEAD:distro/linux/package.nix
            git show HEAD:distro/llvm-toolchain/unwrapped.nix
          } > results/provenance.txt
          for mode in on off; do
            timeout --kill-after=5 300 node result-runner/run-test.js --cpus 4 \
              result-kernel/dist/index.js "result-$mode/correctness.cpio" \
              2>&1 | tee "results/correctness-$mode.log"
          done
          for trial in 1 2 3; do
            modes=(off on)
            if [[ "$trial" == 2 ]]; then modes=(on off); fi
            for mode in "${modes[@]}"; do
              timeout --kill-after=5 300 node result-runner/run-test.js --cpus 4 \
                result-kernel/dist/index.js "result-$mode/benchmark.cpio" \
                2>&1 | tee "results/trial-$trial-$mode.log"
              python3 scripts/validate-mmap-benchmark.py "$BITS" \
                < "results/trial-$trial-$mode.log" > "results/trial-$trial-$mode.csv"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mmap-paired-${{ inputs.comparison }}-wasm${{ matrix.bits }}
          path: results/
          if-no-files-found: warn
          retention-days: 7
