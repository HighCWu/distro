# SPDX-License-Identifier: MIT
name: Fresh fork benchmark

on:
  workflow_call:
    inputs:
      profile:
        type: boolean
        default: false
      widths:
        description: JSON pointer-width matrix selected by the dispatch workflow
        type: string
        default: '[32,64]'
      worker-pair:
        type: boolean
        default: false
      worker-transform:
        type: boolean
        default: false
      native-compare:
        type: boolean
        default: false
      browser-compare:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Fresh fork wasm${{ matrix.bits }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bits: ${{ fromJSON(inputs.widths) }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify the exact dispatched source
        env:
          BITS: ${{ matrix.bits }}
        run: |
          case "$BITS" in 32|64) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: fork-benchmark-${{ matrix.bits }}-${{ runner.os }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-targeted-v1-${{ runner.os }}-wasm${{ matrix.bits }}-
            nix-ci-${{ runner.os }}-
          save: false
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
      - name: Validate contracts and formatting
        run: |
          node --experimental-vm-modules --test distro/fork-continuation/benchmark.test.js distro/fork-continuation/worker-bundle.test.js
          node --test distro/fork-continuation/latency.test.js
          node --test distro/fork-continuation/latency-browser.test.js
          nix build --no-link --print-build-logs .#checks.x86_64-linux.formatting
      - name: Build immutable inputs, not cached benchmark results
        env:
          BITS: ${{ matrix.bits }}
          PROFILE: ${{ inputs.profile }}
          WORKER_PAIR: ${{ inputs.worker-pair }}
          WORKER_TRANSFORM: ${{ inputs.worker-transform }}
          NATIVE_COMPARE: ${{ inputs.native-compare }}
          BROWSER_COMPARE: ${{ inputs.browser-compare }}
        run: |
          suffix=""
          attribute=benchmarkAssets
          if [[ "$PROFILE" == true ]]; then attribute=benchmarkProfileAssets; fi
          if [[ "$WORKER_PAIR" == true ]]; then
            test "$PROFILE" != true
            attribute=benchmarkWorkerPairAssets
          fi
          if [[ "$WORKER_TRANSFORM" == true ]]; then
            test "$PROFILE" != true
            test "$WORKER_PAIR" != true
            attribute=benchmarkWorkerTransformAssets
          fi
          if [[ "$NATIVE_COMPARE" == true ]]; then
            test "$PROFILE" != true
            test "$WORKER_PAIR" != true
            test "$WORKER_TRANSFORM" != true
            attribute=nativeComparisonAssets
          fi
          if [[ "$BROWSER_COMPARE" == true ]]; then
            test "$PROFILE" != true
            test "$WORKER_PAIR" != true
            test "$WORKER_TRANSFORM" != true
            test "$NATIVE_COMPARE" != true
            attribute=browserComparisonAssets
          fi
          if [[ "$BITS" == 64 ]]; then suffix="-wasm64"; fi
          nix build --print-build-logs --out-link result-fork-benchmark \
            ".#legacyPackages.x86_64-linux.fork-continuation$suffix.$attribute"
      - name: Measure three fresh Node processes and Linux boots per case
        env:
          BITS: ${{ matrix.bits }}
          WORKER_PAIR: ${{ inputs.worker-pair }}
          WORKER_TRANSFORM: ${{ inputs.worker-transform }}
          NATIVE_COMPARE: ${{ inputs.native-compare }}
          BROWSER_COMPARE: ${{ inputs.browser-compare }}
        run: |
          mkdir -p results provenance
          {
            printf 'distro_revision=%s\npointer_bits=%s\n' "$GITHUB_SHA" "$BITS"
            printf 'run=%s/%s/actions/runs/%s\nattempt=%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            uname -a
            lscpu
            readlink -f result-fork-benchmark
            if [[ "$NATIVE_COMPARE" == true || "$BROWSER_COMPARE" == true ]]; then
              sha256sum result-fork-benchmark/manifest.json result-fork-benchmark/latency.c result-fork-benchmark/latency-exec.c
            elif [[ "$WORKER_TRANSFORM" == true ]]; then
              sha256sum result-fork-benchmark/{baseline,transformed}/manifest.json
            elif [[ "$WORKER_PAIR" == true ]]; then
              sha256sum result-fork-benchmark/{baseline,bundled}/manifest.json
            else
              sha256sum result-fork-benchmark/manifest.json result-fork-benchmark/benchmark.c
            fi
            git show HEAD:distro/linux/package.nix
            git show HEAD:distro/llvm-toolchain/unwrapped.nix
          } > "provenance/wasm$BITS.txt"
          if [[ "$BROWSER_COMPARE" == true ]]; then
            result-fork-benchmark/run-browser-latency "results/wasm$BITS"
          elif [[ "$NATIVE_COMPARE" == true ]]; then
            node result-fork-benchmark/latency-run.mjs result-fork-benchmark "results/wasm$BITS"
          elif [[ "$WORKER_PAIR" == true || "$WORKER_TRANSFORM" == true ]]; then
            node result-fork-benchmark/benchmark-pair.mjs result-fork-benchmark "results/wasm$BITS"
          else
            node result-fork-benchmark/benchmark-run.mjs result-fork-benchmark "results/wasm$BITS"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fork-benchmark-wasm${{ matrix.bits }}-${{ inputs.browser-compare && 'browser-compare' || inputs.native-compare && 'native-compare' || inputs.worker-transform && 'worker-transform' || inputs.worker-pair && 'worker-pair' || inputs.profile && 'profile' || 'baseline' }}-${{ github.sha }}
          path: |
            results/
            provenance/
          if-no-files-found: warn
          retention-days: 7
